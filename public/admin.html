<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Invitation admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c2a23;--ink:#f3ead7;--muted:#a9bdb4;--gold:#d8b46a;--panel:rgba(255,255,255,.06);--line:rgba(216,180,106,.3)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% 0,#10352c,#071a16);color:var(--ink);font-family:Jost,system-ui,sans-serif;padding:24px 16px 60px;display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:600px}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0 0 6px}
h1{font-size:34px}h2{font-size:26px}
p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:140px;font:inherit;font-size:16px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:inherit;font-weight:500;font-size:15px;border:0;border-radius:10px;padding:11px 18px;background:var(--gold);color:#2b1f08;cursor:pointer}
button.alt{background:transparent;color:var(--gold);border:1px solid var(--gold)}
button.sm{padding:7px 12px;font-size:13px}
button.x{background:none;color:var(--muted);font-size:22px;padding:0 8px;line-height:1}
ul{list-style:none;margin:14px 0 0;padding:0}
li{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
li .n{flex:1;min-width:130px}li .n small{display:block;color:var(--muted);font-size:12px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.err{color:#ffb4a2;font-size:14px;min-height:20px;margin:10px 0 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#10352c;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section id="login" class="panel" hidden>
    <h1>Admin sign in</h1>
    <p>Sign in to add guests and send their personal invitation links.</p>
    <div class="row" style="flex-direction:column">
      <input id="lu" placeholder="Username" autocomplete="username">
      <input id="lp" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn">Sign in</button>
    </div>
    <p class="err" id="loginErr"></p>
  </section>

  <div id="app" hidden>
    <div class="top">
      <h1>Invitation admin</h1>
      <div class="acts"><span id="who" style="color:var(--muted);font-size:14px"></span><button class="alt sm" id="logout">Sign out</button></div>
    </div>

    <section class="panel">
      <h2>Guests</h2>
      <p>Add a name, then copy or WhatsApp that person’s personal link.</p>
      <div class="row"><input id="gn" placeholder="Guest name, e.g. Amina K" autocomplete="off"><button id="addGuest">Add guest</button></div>
      <p class="err" id="gErr"></p>
      <ul id="guests"></ul>
      <p id="gEmpty">No guests yet.</p>
      <button class="alt sm" id="copyAll">Copy all links</button>
    </section>

    <section class="panel">
      <h2>Admins</h2>
      <p>Admins can add guests and add other admins.</p>
      <div class="row"><input id="an" placeholder="New admin username" autocomplete="off"><input id="ap" type="password" placeholder="Password (8+ characters)" autocomplete="new-password"><button id="addAdmin">Add admin</button></div>
      <p class="err" id="aErr"></p>
      <ul id="admins"></ul>
    </section>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
let me = '', guests = [];
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : (method === 'GET' ? {} : { 'Content-Type': 'application/json' }), body: body ? JSON.stringify(body) : (method === 'GET' ? undefined : '{}') });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'Something went wrong'); e.status = r.status; throw e; }
  return d;
}
let tt; function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
async function copy(text, msg){ try{ await navigator.clipboard.writeText(text); toast(msg); }catch(e){ window.prompt('Copy this:', text); } }

function show(signedIn){ $('login').hidden = signedIn; $('app').hidden = !signedIn; }
async function boot(){
  try { me = (await api('GET','/api/me')).username; $('who').textContent = me; show(true); await Promise.all([loadGuests(), loadAdmins()]); }
  catch(e){ show(false); }
}
$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  try { await api('POST','/api/login',{ username:$('lu').value, password:$('lp').value }); $('lp').value=''; boot(); }
  catch(e){ $('loginErr').textContent = e.message; }
};
$('lp').addEventListener('keydown', e => { if(e.key==='Enter') $('loginBtn').click(); });
$('logout').onclick = async () => { await api('POST','/api/logout'); show(false); };

async function loadGuests(){ guests = await api('GET','/api/guests'); renderGuests(); }
function renderGuests(){
  const ul = $('guests'); ul.innerHTML = '';
  $('gEmpty').hidden = guests.length > 0;
  guests.forEach(g => {
    const li = document.createElement('li');
    const n = document.createElement('span'); n.className='n'; n.textContent = g.name;
    const s = document.createElement('small'); s.textContent = g.opens ? `Opened ${g.opens}×` : 'Not opened yet'; n.appendChild(s);
    const acts = document.createElement('div'); acts.className='acts';
    const c = document.createElement('button'); c.className='sm'; c.textContent='Copy link'; c.onclick = () => copy(g.link, 'Link copied for ' + g.name);
    const w = document.createElement('button'); w.className='alt sm'; w.textContent='WhatsApp';
    w.onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(`Hi ${g.name}! You’re invited to our Single Adults Dinner. Tap to open your invitation: ${g.link}`), '_blank');
    const x = document.createElement('button'); x.className='x'; x.textContent='×'; x.setAttribute('aria-label','Remove '+g.name);
    x.onclick = async () => { if(!confirm('Remove '+g.name+'? Their link will stop working.')) return; await api('DELETE','/api/guests/'+g.id); loadGuests(); };
    acts.append(c,w,x); li.append(n,acts); ul.appendChild(li);
  });
}
async function addGuest(){
  $('gErr').textContent='';
  const name = $('gn').value.trim(); if(!name) return;
  try { await api('POST','/api/guests',{ name }); $('gn').value=''; $('gn').focus(); loadGuests(); }
  catch(e){ $('gErr').textContent = e.message; }
}
$('addGuest').onclick = addGuest;
$('gn').addEventListener('keydown', e => { if(e.key==='Enter') addGuest(); });
$('copyAll').onclick = () => { if(!guests.length) return toast('Add a guest first'); copy(guests.map(g => g.name + ': ' + g.link).join('\n'), 'All links copied'); };

async function loadAdmins(){
  const list = await api('GET','/api/admins'); const ul = $('admins'); ul.innerHTML='';
  list.forEach(a => {
    const li = document.createElement('li');
    const n = document.createElement('span'); n.className='n'; n.textContent = a.username + (a.username===me ? ' (you)' : '');
    li.appendChild(n);
    if(a.username!==me){
      const x = document.createElement('button'); x.className='x'; x.textContent='×'; x.setAttribute('aria-label','Remove admin '+a.username);
      x.onclick = async () => { if(!confirm('Remove admin '+a.username+'?')) return; try{ await api('DELETE','/api/admins/'+encodeURIComponent(a.username)); loadAdmins(); }catch(e){ $('aErr').textContent=e.message; } };
      li.appendChild(x);
    }
    ul.appendChild(li);
  });
}
$('addAdmin').onclick = async () => {
  $('aErr').textContent='';
  try { await api('POST','/api/admins',{ username:$('an').value, password:$('ap').value }); $('an').value=''; $('ap').value=''; toast('Admin added'); loadAdmins(); }
  catch(e){ $('aErr').textContent = e.message; }
};
boot();
</script>
</body>
</html>
